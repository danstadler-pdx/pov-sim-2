# Stage 3.1 — Grafana Kubernetes Monitoring chart values.
# Generated by the Cloud Kubernetes Monitoring wizard, modified to read the
# auth token from an env var so it isn't committed to git. Render with
# `envsubst` at install time (see helm-charts/k8s-monitoring/install.sh).
#
# Reuses Stage 2's per-product instance IDs:
#   - Prom instance: 3203994
#   - Loki instance: 1597672
#   - Stack ID:      1639885  (used for Fleet Management remoteConfig)
#
# Token in .env as CLOUD_K8S_MONITORING_TOKEN (a CAP token auto-created by
# the Cloud K8s Monitoring wizard, scoped to metrics/logs/traces:write).

cluster:
  name: povsim

destinations:
  grafana-cloud-metrics:
    type: prometheus
    url: https://prometheus-prod-67-prod-us-west-0.grafana.net./api/prom/push
    auth:
      type: basic
      username: "3203994"
      password: ${CLOUD_K8S_MONITORING_TOKEN}
  grafana-cloud-logs:
    type: loki
    url: https://logs-prod-021.grafana.net./loki/api/v1/push
    auth:
      type: basic
      username: "1597672"
      password: ${CLOUD_K8S_MONITORING_TOKEN}

clusterMetrics:
  enabled: true
  collector: alloy-metrics

hostMetrics:
  enabled: true
  collector: alloy-metrics
  linuxHosts:
    enabled: true
  windowsHosts:
    enabled: true
  energyMetrics:
    enabled: true

costMetrics:
  enabled: true
  collector: alloy-metrics

clusterEvents:
  enabled: true
  collector: alloy-singleton

podLogsViaLoki:
  enabled: true
  collector: alloy-logs

collectors:
  alloy-metrics:
    presets:
      - clustered
      - statefulset
  alloy-singleton:
    presets:
      - singleton
  alloy-logs:
    presets:
      - filesystem-log-reader
      - daemonset

collectorCommon:
  alloy:
    remoteConfig:
      enabled: true
      url: https://fleet-management-prod-014.grafana.net
      auth:
        type: basic
        username: "1639885"
        password: ${CLOUD_K8S_MONITORING_TOKEN}

telemetryServices:
  kube-state-metrics:
    deploy: true
  node-exporter:
    deploy: true
  windows-exporter:
    deploy: true
  opencost:
    deploy: true
    metricsSource: grafana-cloud-metrics
    opencost:
      exporter:
        defaultClusterId: povsim
      prometheus:
        existingSecretName: grafana-cloud-metrics-grafana-k8s-monitoring
        external:
          url: https://prometheus-prod-67-prod-us-west-0.grafana.net./api/prom
  kepler:
    deploy: true
